name: Dr.dermAi
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.10.5+9
  image: ^4.1.3
  tflite_flutter: ^0.12.1
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  provider: ^6.1.1
  
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/model/skin_ai_quantized.tflite
    - assets/model/labels.txt
    - assets/images/logo.png
